name: Frontend CI/CD Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "$HOME/autoparts-webhub-frontend" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$HOME/autoparts-webhub-frontend"
            fi
            cd "$HOME/autoparts-webhub-frontend"
            git pull origin main || git pull origin master
            echo "VITE_API_URL=${{ vars.VITE_API_URL || 'http://host.docker.internal:3000' }}" > .env
            docker compose down || true
            docker compose up -d --build
